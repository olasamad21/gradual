name: gradual
description: "Gradual: learn one technical concept a day."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.4
  flutter_native_splash: ^2.4.7
  google_fonts: ^8.2.1
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_native_splash:
  # Images come from tool/brand/render_brand_assets_test.dart.
  color: "#2E7D32"
  image: assets/brand/splash_light.png
  color_dark: "#0F1115"
  image_dark: assets/brand/splash_dark.png
  android_12:
    color: "#2E7D32"
    image: assets/brand/splash_android12_light.png
    color_dark: "#0F1115"
    image_dark: assets/brand/splash_android12_dark.png
  web: true
  fullscreen: true

flutter_launcher_icons:
  # Images come from tool/brand/render_brand_assets_test.dart.
  image_path: assets/brand/icon.png
  android: true
  ios: false
  min_sdk_android: 21
  adaptive_icon_background: assets/brand/icon_background.png
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  web:
    generate: true
    image_path: assets/brand/icon.png
    background_color: "#2E7D32"
    theme_color: "#2E7D32"
